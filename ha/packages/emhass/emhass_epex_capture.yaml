# EMHASS: EpexPredictor forecast-as-of capture.
#
# No outside entities. The shell command calls a THIRD-PARTY site,
# https://epexpredictor.batzill.com (the same service the EpexPredictor HACS
# integration reads), twice a day, and appends the raw response to disk. Keep
# the gate helper off if you do not want that call made from your HA host.
# region=NL is the reference plant's bidding zone: set yours.
#
# Every live solve already archives the prices it used (/config/emhass/plans),
# but that record lives and dies with the shadow planner. This captures the raw
# /prices response of the predictor twice a day, independent of EMHASS, so a
# later replay can price a horizon beyond the auction frontier with the
# forecast as it stood at the time. The recorder cannot hold this: the
# forecast attribute is > 16 kB and is dropped (see the epex_predictor sensor).
# No recorder-visible attribute here, one JSON line per capture on disk:
#   /config/emhass/epex_raw/YYYY-MM.jsonl   {"issued_utc": ..., "body": {...}}
# about 37 kB per line, 2 a day. Reader: backtest/pricefill.py (the as-issued lane).
#
# 12:05 local: the last read of tomorrow as a pure forecast, before the
# auction publishes (~13:00). 00:05 local: the overnight refresh, D+2 in view.
# Gate: input_boolean.emhass_epex_capture_enabled (no initial:, seed it once).

input_boolean:
  emhass_epex_capture_enabled:
    name: EMHASS epex forecast capture enabled
    icon: mdi:database-clock

shell_command:
  emhass_epex_capture: |
    sh -c 'd=/config/emhass/epex_raw; mkdir -p "$d"; b=$(curl -sf --max-time 60 "https://epexpredictor.batzill.com/prices?region=NL&surcharge=0&taxPercent=0&unit=EUR_PER_KWH&hours=120&timezone=UTC") && [ -n "$b" ] && printf "{\"issued_utc\":\"%s\",\"body\":%s}\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$b" >> "$d/$(date -u +%Y-%m).jsonl"'

automation:
  - id: emhass_epex_capture
    alias: "EMHASS - capture the epex forecast as issued"
    mode: single
    trigger:
      - trigger: time
        at:
          - "00:05:00"
          - "12:05:00"
    condition:
      - condition: state
        entity_id: input_boolean.emhass_epex_capture_enabled
        state: "on"
    action:
      - action: shell_command.emhass_epex_capture
