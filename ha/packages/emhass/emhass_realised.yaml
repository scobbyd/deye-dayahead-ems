# EMHASS shadow planner: the incumbent EMS's metered flows, re-priced.
#
# Outside entities this file expects (rename to yours):
#   sensor.p1reader2_p1_reader_2_power_consumed   fiscal (P1) meter import, kW
#   sensor.p1reader2_p1_reader_2_power_returned   fiscal (P1) meter export, kW
#   sensor.inverter_battery                       pack SOC, %
#   sensor.inverter_today_production              the inverter's daily PV counter, kWh (includes the microinverter)
#   switch.inverter_export_surplus                the inverter's export-surplus switch
#
# Not "what the supplier billed": the supplier settles on its own contract.
# This is the fiscal meter's flows put through the EMHASS tariff frame, which
# is what makes it comparable with the plan lanes.
#
# The P1 meter (kW, 10 s) times the tariff-now sensors gives a cost
# rate in EUR/h; integrating it (left Riemann, the rate is a step function of
# the 15-min price) gives EUR; a daily utility meter with net_consumption
# (export makes the total fall) yields yesterday's realised cash in last_period
# at 00:00. The two trigger templates freeze the SOC at midnight (state = SOC
# entering the new day, previous = SOC that entered the day just ended) and
# yesterday's PV production. pyscript.emhass_score_day reads all of it at 00:10.
#
# Since 2026-09-04 emhass_grid_cost_daily is a CROSS-CHECK, not the scored
# figure: it follows the LIVE tariff helpers, so an edit mid-day prices it
# differently from the plan of record archived the night before (0,75 EUR of the
# 2026-09-03 headline). The scorer re-settles the same measured flows in the
# plan's own archived frame and keeps this number alongside as
# realised_cash_meter_eur; a disagreement past METER_DRIFT_EUR raises the
# meter_drift flag, which is the helper-drift alarm.

template:
  - sensor:
      - name: EMHASS grid cost rate
        unique_id: emhass_grid_cost_rate
        unit_of_measurement: EUR/h
        state_class: measurement
        icon: mdi:cash-clock
        availability: >
          {{ has_value('sensor.p1reader2_p1_reader_2_power_consumed')
             and has_value('sensor.p1reader2_p1_reader_2_power_returned')
             and has_value('sensor.emhass_buy_price_now')
             and has_value('sensor.emhass_sell_price_now') }}
        state: >
          {% set imp = states('sensor.p1reader2_p1_reader_2_power_consumed') | float(0) %}
          {% set exp = states('sensor.p1reader2_p1_reader_2_power_returned') | float(0) %}
          {% set buy = states('sensor.emhass_buy_price_now') | float(0) %}
          {% set sell = states('sensor.emhass_sell_price_now') | float(0) %}
          {{ (imp * buy - exp * sell) | round(6) }}

  - trigger:
      - trigger: time
        at: "00:00:00"
    sensor:
      - name: EMHASS SOC midnight
        unique_id: emhass_soc_midnight
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-clock
        state: "{{ states('sensor.inverter_battery') }}"
        attributes:
          previous: >
            {{ this.state if this is defined and this.state not in ['unknown', 'unavailable', 'none', ''] else none }}
          date: "{{ now().date() | string }}"

  - trigger:
      - trigger: time
        at: "23:59:30"
    sensor:
      - name: EMHASS PV daily kWh
        unique_id: emhass_pv_daily_kwh
        unit_of_measurement: kWh
        state_class: measurement
        icon: mdi:solar-power
        state: "{{ states('sensor.inverter_today_production') | float(0) | round(1) }}"
        attributes:
          date: "{{ now().date() | string }}"


# ---------------------------------------------------------------------------
# PV curtailment mask (ruling 2026-09-05).
#
# The Deye holds the MAIN array back when the real pack is full and there is
# nowhere to put the power. Measured PV is then not exogenous, and handing it
# to the counterfactual lanes starves a virtual pack that would have had room:
# on 09-05 the array made 1.496 W at 13:00 against a ~7.900 W potential, purely
# because the real pack sat at 99 %.
#
# The site observation, at 5-minute resolution: export was disabled with the pack
# at 90 % and ~3 kW on the array; the cut itself began as SOC crossed 95 % at
# 09:24, dropping the array to ~1 kW and tapering to zero as the pack topped
# out. So the trigger is the 95 % crossing and export-off is the precondition
# that precedes it - hence both, ANDed.
#
# Use the inverter's own export switch, NOT an EMS master gate helper: the
# retired DIY EMS's sell gate sat off all of 09-05 and would have masked the
# whole day instead of the curtailed part of it.
#
# Numeric 0/1 with state_class measurement so the recorder keeps 5-minute
# statistics: pyscript reads it as a series like any other, and a 15-minute
# mean between 0 and 1 is the FRACTION of the step that was curtailed, which is
# more honest than a boolean at the edges. emhass_core.pv_potential thresholds
# it. Charting it is fair game; it is the reason a scored day's PV is partly
# reconstructed.
  - trigger:
      - trigger: time_pattern
        seconds: "/30"
    sensor:
      - name: "PV curtailment active"
        unique_id: pv_curtailment_active
        state_class: measurement
        icon: mdi:solar-panel-large
        availability: >
          {{ has_value('sensor.inverter_battery')
             and states('switch.inverter_export_surplus') in ['on', 'off'] }}
        state: >
          {{ 1 if (states('sensor.inverter_battery') | float(0) > 95
                   and is_state('switch.inverter_export_surplus', 'off')) else 0 }}
        attributes:
          soc_pct: "{{ states('sensor.inverter_battery') | float(0) }}"
          export_surplus: "{{ states('switch.inverter_export_surplus') }}"


sensor:
  - platform: integration
    name: EMHASS grid cost
    unique_id: emhass_grid_cost
    source: sensor.emhass_grid_cost_rate
    unit_time: h
    method: left
    round: 4
    max_sub_interval:
      minutes: 5

utility_meter:
  emhass_grid_cost_daily:
    name: EMHASS grid cost daily
    unique_id: emhass_grid_cost_daily
    source: sensor.emhass_grid_cost
    cycle: daily
    net_consumption: true
